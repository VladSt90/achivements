name: Build Vite Project

on:
  push:
    branches:
      - main # Change this to the branch you want to monitor
  pull_request:
    branches:
      - main # Trigger build on pull requests to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16' # Specify the Node.js version (match your Vite project requirements)

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Upload build artifacts (optional)
      uses: actions/upload-artifact@v3
      with:
        name: build-output
        path: dist # Change this if your Vite output directory is different
        
    - name: Deploy to GitHub Pages
      run: npm run deploy